<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة تسجيل الدخول / الخروج</title>
    <style>
        body {
            background-color: #121212; /* خلفية داكنة جداً مثل الصورة */
            color: white;
            font-family: Arial, sans-serif; /* خط بسيط */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1a1a1a; /* لون الحاوية أفتح قليلاً */
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            width: 350px; /* عرض مناسب */
        }

        .tabs-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            border: 2px solid;
            border-radius: 8px;
            background-color: transparent;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        /* زر تسجيل الخروج (يسار) - حدود خضراء، كتابة خضراء */
        .tab-logout {
            border-color: #4CAF50;
            color: #4CAF50;
            margin-left: 10px; /* مسافة بين الأزرار */
        }

        .tab-logout:hover {
            background-color: rgba(76, 175, 80, 0.1);
        }

        /* زر تسجيل الدخول (يمين) - خلفية خضراء كاملة */
        .tab-login {
            border-color: transparent;
            background-color: #4CAF50;
            color: #121212;
        }

        .tab-login:hover {
            background-color: #45a049;
        }

        /* تنسيق الحقول */
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #b0b0b0; /* لون نص باهت */
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #222; /* لون حقل المدخلات */
            border: 1px solid #444; /* حدود الحقل */
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box; /* التأكد من العرض الكامل */
        }

        input:focus {
            outline: none;
            border-color: #4CAF50; /* تظليل أخضر عند التركيز */
        }

        /* زر الإرسال الأزرق */
        .submit-button {
            width: 100%;
            padding: 15px;
            background-color: #2196F3; /* لون أزرق مثل الصورة */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #1e88e5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الأزرار العلوية -->
        <div class="tabs-container">
            <button class="tab-button tab-logout">تسجيل خروج</button>
            <button class="tab-button tab-login">تسجيل دخول</button>
        </div>

        <!-- حقول الإدخال -->
        <form action="#" method="post">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label for="roblox">اسم حسابك Roblox</label>
                <input type="text" id="roblox" name="roblox" placeholder="Roblox Username" required>
            </div>

            <div class="input-group">
                <label for="discord">يوزر حسابك Discord</label>
                <input type="text" id="discord" name="discord" placeholder="username_kr" required>
            </div>

            <!-- زر الإرسال الأزرق -->
            <button type="submit" class="submit-button">إرسال الطلب</button>
        </form>
    </div>

</body>
</html>
