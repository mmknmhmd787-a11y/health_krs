<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل حضور المسعفين المتطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background: radial-gradient(circle at top right, #1a1c29, #0d0e15, #050508);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(229, 57, 53, 0.05);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, #ff1744, transparent, #29b6f6);
            border-radius: 26px;
            z-index: -1;
            opacity: 0.15;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(229, 57, 53, 0.12);
            border: 1px solid rgba(229, 57, 53, 0.3);
            color: #ff5252;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #ffffff 30%, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #8f92a1;
            margin: 0;
        }

        .status-toggle-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .status-toggle-btn.login-state {
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #000;
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.25);
        }

        .status-toggle-btn.login-state:hover {
            box-shadow: 0 10px 30px rgba(0, 230, 118, 0.4);
            transform: translateY(-2px);
        }

        .status-toggle-btn.logout-state {
            background: linear-gradient(135deg, #ff1744, #f50057);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.3);
        }

        .status-toggle-btn.logout-state:hover {
            box-shadow: 0 10px 30px rgba(255, 23, 68, 0.5);
            transform: translateY(-2px);
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a5b5;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #00b0ff;
            box-shadow: 0 0 15px rgba(0, 176, 255, 0.2);
        }

        input::placeholder {
            color: #525665;
        }

        .submit-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #29b6f6, #0288d1);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(2, 136, 209, 0.3);
        }

        .submit-button:hover {
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            box-shadow: 0 10px 25px rgba(2, 136, 209, 0.45);
            transform: translateY(-2px);
        }

        .submit-button:disabled {
            background: #2a2d3a;
            color: #6c727f;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge">
                <span>🚑</span> قطاع الهلال الأحمر
            </div>
            <h1>بوابة الحضور الرقمية</h1>
            <p>سجّل استلامك اليومي بسهولة وسرعة</p>
        </div>

        <button id="authBtn" class="status-toggle-btn login-state" onclick="toggleAuthStatus()">
            <span>تسجيل دخول</span>
        </button>

        <form id="paramedicForm" onsubmit="handleSubmit(event)">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <div class="input-wrapper">
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>
            </div>

            <div class="input-group">
                <label for="roblox">اسم حسابك Roblox</label>
                <div class="input-wrapper">
                    <input type="text" id="roblox" placeholder="Roblox Username" required>
                </div>
            </div>

            <div class="input-group">
                <label for="discord">يوزر حسابك Discord</label>
                <div class="input-wrapper">
                    <input type="text" id="discord" placeholder="username_kr" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="submit-button">تأكيد وإرسال البيانات</button>
        </form>
    </div>

    <script>
        // رابط الـ Webhook الجديد
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbz8lKkHQpq_H29QZ7yUnyVJswX6OP_s-cjemzxMzbJkif6jDHT4nAx4m1v6WYuR4cOutg/exec";

        let isLoggedIn = false;

        function toggleAuthStatus() {
            const btn = document.getElementById('authBtn');
            if (!isLoggedIn) {
                btn.innerHTML = '<span>تسجيل خروج</span>';
                btn.classList.remove('login-state');
                btn.classList.add('logout-state');
                isLoggedIn = true;
            } else {
                btn.innerHTML = '<span>تسجيل دخول</span>';
                btn.classList.remove('logout-state');
                btn.classList.add('login-state');
                isLoggedIn = false;
            }
        }

        async function handleSubmit(event) {
            event.preventDefault();

            const emailUser = document.getElementById('email').value.trim().toLowerCase();
            const discordUser = document.getElementById('discord').value.trim().toLowerCase();
            const todayDate = new Date().toISOString().split('T')[0];

            const emailKey = `submission_email_${emailUser}_${todayDate}`;
            const discordKey = `submission_discord_${discordUser}_${todayDate}`;

            if (localStorage.getItem(emailKey) || localStorage.getItem(discordKey)) {
                alert('عذراً! تم تسجيل الحضور بهذا البريد الإلكتروني أو حساب Discord اليوم بالفعل.');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الإرسال...';

            const payload = {
                action: isLoggedIn ? 'تسجيل خروج' : 'تسجيل دخول',
                email: emailUser,
                roblox: document.getElementById('roblox').value,
                discord: discordUser
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                localStorage.setItem(emailKey, "true");
                localStorage.setItem(discordKey, "true");

                alert('تم تسجيل البيانات بنجاح!');
            } catch (error) {
                alert('حدث خطأ أثناء الإرسال!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'تأكيد وإرسال البيانات';
            }
        }
    </script>

</body>
</html>
