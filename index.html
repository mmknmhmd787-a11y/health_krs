<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل حضور المسعفين المتطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background: radial-gradient(circle at top right, #1a1c29, #0d0e15, #050508);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(229, 57, 53, 0.05);
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #ff1744, transparent, #29b6f6);
            border-radius: 26px;
            z-index: -1;
            opacity: 0.15;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(229, 57, 53, 0.12);
            border: 1px solid rgba(229, 57, 53, 0.3);
            color: #ff5252;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .date-box {
            background: rgba(0, 176, 255, 0.08);
            border: 1px solid rgba(0, 176, 255, 0.2);
            color: #29b6f6;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-around;
            gap: 5px;
            direction: ltr;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #ffffff 30%, #a5a5a5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: #8f92a1;
            margin: 0;
        }

        .status-toggle-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-toggle-btn.login-state {
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #000;
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.25);
        }

        .status-toggle-btn.logout-state {
            background: linear-gradient(135deg, #ff1744, #f50057);
            color: #fff;
            box-shadow: 0 8px 25px rgba(255, 23, 68, 0.3);
        }

        .input-group {
            margin-bottom: 16px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #a0a5b5;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #00b0ff;
            box-shadow: 0 0 15px rgba(0, 176, 255, 0.2);
        }

        .submit-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #29b6f6, #0288d1);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(2, 136, 209, 0.3);
        }

        .admin-btn {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #8f92a1;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .admin-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-color: #00b0ff;
        }

        .admin-panel {
            display: none;
        }

        /* مربع البحث */
        .search-box {
            margin-bottom: 12px;
        }

        .search-box input {
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
        }

        .table-wrapper {
            max-height: 260px;
            overflow-y: auto;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            text-align: right;
        }

        th, td {
            padding: 8px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(0, 0, 0, 0.4);
            color: #00b0ff;
            position: sticky;
            top: 0;
        }

        .back-btn {
            background: #ff1744;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            width: 48%;
        }

        .clear-btn {
            background: #444;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            width: 48%;
        }

        .admin-controls {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم تسجيل المسعفين -->
        <div id="userSection">
            <div class="header">
                <div class="badge">
                    <span>🚑</span> قطاع الهلال الأحمر
                </div>
                <div class="date-box" id="currentDateBox">
                    <span id="gregorianDate">--/--/----</span>
                    <span>|</span>
                    <span id="hijriDate">--/--/---- هـ</span>
                </div>
                <h1>بوابة الحضور الرقمية</h1>
                <p>سجّل استلامك اليومي بسهولة وسرعة</p>
            </div>

            <button id="authBtn" class="status-toggle-btn login-state" onclick="toggleAuthStatus()">
                <span>تسجيل دخول</span>
            </button>

            <form id="paramedicForm" onsubmit="handleSubmit(event)">
                <div class="input-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="roblox">اسم حسابك Roblox</label>
                    <input type="text" id="roblox" placeholder="Roblox Username" required>
                </div>

                <div class="input-group">
                    <label for="discord">يوزر حسابك Discord</label>
                    <input type="text" id="discord" placeholder="username_kr" required>
                </div>

                <button type="submit" id="submitBtn" class="submit-button">تأكيد وإرسال البيانات</button>
            </form>

            <button class="admin-btn" onclick="openAdminPanel()">⚙️ لوحة الإدارة</button>
        </div>

        <!-- قسم لوحة الإدارة -->
        <div id="adminSection" class="admin-panel">
            <div class="header">
                <h1>🔐 لوحة التحكم والسجلات</h1>
                <p>عرض المسجلين مع تواريخ الحضور</p>
            </div>

            <!-- حقل البحث -->
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="filterLogs()" placeholder="🔍 ابحث بالاسم، الديسكورد، أو البريد...">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>التاريخ والوقت</th>
                            <th>الإجراء</th>
                            <th>البريد</th>
                            <th>روبلوكس</th>
                            <th>ديسكورد</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                    </tbody>
                </table>
            </div>

            <div class="admin-controls">
                <button class="back-btn" onclick="closeAdminPanel()">العودة</button>
                <button class="clear-btn" onclick="clearLogs()">مسح السجل</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASS = "kr-2026-8";
        let isLoggedIn = false;

        window.onload = function() {
            const now = new Date();
            const optionsGreg = { year: 'numeric', month: '2-digit', day: '2-digit' };
            document.getElementById('gregorianDate').textContent = now.toLocaleDateString('en-GB', optionsGreg);

            const optionsHijri = { year: 'numeric', month: 'numeric', day: 'numeric', calendar: 'islamic-umalqura' };
            const hijriStr = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', optionsHijri).format(now);
            document.getElementById('hijriDate').textContent = hijriStr + ' هـ';
        };

        function toggleAuthStatus() {
            const btn = document.getElementById('authBtn');
            if (!isLoggedIn) {
                btn.innerHTML = '<span>تسجيل خروج</span>';
                btn.classList.remove('login-state');
                btn.classList.add('logout-state');
                isLoggedIn = true;
            } else {
                btn.innerHTML = '<span>تسجيل دخول</span>';
                btn.classList.remove('logout-state');
                btn.classList.add('login-state');
                isLoggedIn = false;
            }
        }

        function handleSubmit(event) {
            event.preventDefault();

            const emailUser = document.getElementById('email').value.trim().toLowerCase();
            const discordUser = document.getElementById('discord').value.trim().toLowerCase();
            const todayDateKey = new Date().toISOString().split('T')[0];

            const emailKey = `submission_email_${emailUser}_${todayDateKey}`;
            const discordKey = `submission_discord_${discordUser}_${todayDateKey}`;

            if (localStorage.getItem(emailKey) || localStorage.getItem(discordKey)) {
                alert('عذراً! تم تسجيل الحضور بهذا البريد الإلكتروني أو حساب Discord اليوم بالفعل.');
                return;
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
            const gregStr = now.toLocaleDateString('en-GB', { year: 'numeric', month: '2-digit', day: '2-digit' });
            
            const optionsHijri = { year: 'numeric', month: 'numeric', day: 'numeric', calendar: 'islamic-umalqura' };
            const hijriStr = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', optionsHijri).format(now);

            const record = {
                dateTime: `${gregStr} | ${hijriStr}هـ<br><span style="color:#00b0ff;">${timeStr}</span>`,
                action: isLoggedIn ? 'تسجيل خروج' : 'تسجيل دخول',
                email: emailUser,
                roblox: document.getElementById('roblox').value,
                discord: discordUser
            };

            let logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
            logs.unshift(record);
            localStorage.setItem('attendance_logs', JSON.stringify(logs));

            localStorage.setItem(emailKey, "true");
            localStorage.setItem(discordKey, "true");

            alert('تم تسجيل البيانات بنجاح!');
            document.getElementById('paramedicForm').reset();
        }

        function openAdminPanel() {
            const password = prompt('يرجى إدخال كلمة سر لوحة الإدارة:');
            if (password === ADMIN_PASS) {
                document.getElementById('searchInput').value = '';
                renderLogs();
                document.getElementById('userSection').style.display = 'none';
                document.getElementById('adminSection').style.display = 'block';
            } else if (password !== null) {
                alert('كلمة السر غير صحيحة!');
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('userSection').style.display = 'block';
        }

        function renderLogs(filterText = '') {
            const logs = JSON.parse(localStorage.getItem('attendance_logs') || '[]');
            const tbody = document.getElementById('logsTableBody');
            tbody.innerHTML = '';

            const filteredLogs = logs.filter(log => {
                const query = filterText.toLowerCase();
                return log.email.toLowerCase().includes(query) ||
                       log.roblox.toLowerCase().includes(query) ||
                       log.discord.toLowerCase().includes(query);
            });

            if (filteredLogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">لا توجد سجلات مطابقة</td></tr>';
                return;
            }

            filteredLogs.forEach(log => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${log.dateTime}</td>
                    <td style="color: ${log.action === 'تسجيل دخول' ? '#00e676' : '#ff1744'};">${log.action}</td>
                    <td>${log.email}</td>
                    <td>${log.roblox}</td>
                    <td>${log.discord}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterLogs() {
            const query = document.getElementById('searchInput').value;
            renderLogs(query);
        }

        function clearLogs() {
            if (confirm('هل أنت تأكد من مسح جميع السجلات المحفوظة؟')) {
                localStorage.removeItem('attendance_logs');
                renderLogs();
            }
        }
    </script>

</body>
</html>
